name: Dependabot PRs

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions: {}

jobs:
  dependabot-metadata:
    name: Fetch metadata
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: read
    outputs:
      dependency-type: ${{ steps.dependabot-metadata.outputs.dependency-type }}
      update-type: ${{ steps.dependabot-metadata.outputs.update-type }}
      package-ecosystem: ${{ steps.dependabot-metadata.outputs.package-ecosystem }}
    steps:
      - name: Fetch Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    needs: dependabot-metadata
    if: |
      needs.dependabot-metadata.result == 'success' &&
      needs.dependabot-metadata.outputs.dependency-type != '' &&
      needs.dependabot-metadata.outputs.update-type != '' &&
      needs.dependabot-metadata.outputs.update-type != 'version-update:semver-major'
    permissions: {}
    steps:
      # Merging with GITHUB_TOKEN does not trigger further workflow runs, so
      # the push to main never starts Release. Act as a GitHub App instead.
      # This workflow only ever runs on Dependabot-triggered events, which see
      # Dependabot secrets rather than Actions secrets — store the private key
      # under Settings > Secrets and variables > Dependabot. Variables are
      # shared, so the client ID lives with the Actions ones.
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Approve
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
