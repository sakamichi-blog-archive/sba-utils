name: Check

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: ${{ matrix.node-version == '26' }}
    strategy:
      matrix:
        # LTS versions are supported; Current is tested but not officially supported
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@c9883cc79df532ad1a7b81bf9ab944ceb090d65c # v2.0.0
        with:
          cache: true
          runtime: node@${{ matrix.node-version }}
      - run: pnpm run check
