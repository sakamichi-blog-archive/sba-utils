name: Check

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        # LTS versions are supported
        node-version: ["22", "24", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          # The store cache key does not include the runtime version, so every
          # matrix job shares one entry and races to write it on a miss — the
          # losers emit a "Failed to save" warning annotation. Cache on the
          # latest LTS only, which keeps a single writer. Bump when 28 goes LTS.
          cache: ${{ matrix.node-version == '26' }}
          runtime: node@${{ matrix.node-version }}
      - run: pnpm run check
