<!doctype html>
<html lang="ja">
  <head>
    <title>スケジュール | 乃木坂46公式サイト</title>
  </head>
  <body>
    <main class="main">
      <div class="sc--wp js-st js-apischedule" data-api="/s/n46/api/list/schedule">
        <div class="sc--nvs js-st-win">
          <div class="m--filbtn js-filterBtn">
            <div class="m--filbtn__win js-filterBtn-win">
              <div class="m--filbtn__bd">
                <div class="m--filbtn__one js-catLink">
                  <input
                    class="m--filbtn__ipt js-catLink-data"
                    type="radio"
                    name="ct"
                    value=""
                    id="ct-all"
                  />
                  <button class="m--filbtn__link" type="button" name="ALL">
                    <label class="m--filbtn__lab" for="ct-all">ALL</label>
                  </button>
                </div>
                <div class="m--filbtn__one js-catLink">
                  <input
                    class="m--filbtn__ipt js-catLink-data"
                    type="radio"
                    name="ct"
                    value="live"
                    id="ct-live"
                  />
                  <button class="m--filbtn__link" type="button" name="ライブ/イベント">
                    <label class="m--filbtn__lab" for="ct-live">ライブ/イベント</label>
                  </button>
                </div>
                <div class="m--filbtn__one js-catLink">
                  <input
                    class="m--filbtn__ipt js-catLink-data"
                    type="radio"
                    name="ct"
                    value="tv"
                    id="ct-tv"
                  />
                  <button class="m--filbtn__link" type="button" name="テレビ">
                    <label class="m--filbtn__lab" for="ct-tv">テレビ</label>
                  </button>
                </div>
                <div class="m--filbtn__one js-catLink">
                  <input
                    class="m--filbtn__ipt js-catLink-data"
                    type="radio"
                    name="ct"
                    value="meetandgreet"
                    id="ct-meetandgreet"
                  />
                  <button class="m--filbtn__link" type="button" name="ミート&amp;グリート">
                    <label class="m--filbtn__lab" for="ct-meetandgreet">ミート&グリート</label>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
